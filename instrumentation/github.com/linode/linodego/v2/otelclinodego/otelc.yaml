version: "v1.2.0"

# (*Client).doRequest is the shared HTTP path for nearly all API calls.
# Present with a stable signature from linodego v2.4.1 onward (matching public_methods.otelc.yaml).
linodego_hook_dorequest:
  target: github.com/linode/linodego/v2
  version: v2.4.1
  where:
    func: doRequest
    recv: "*Client"
  do:
    - inject_hooks:
        before: BeforeDoRequest
        after: AfterDoRequest
        path: "go.opentelemetry.io/otelc-contrib/instrumentation/github.com/linode/linodego/v2/otelclinodego"

linodego_host_extractor:
  target: github.com/linode/linodego/v2
  version: v2.4.1
  do:
    - add_file:
        file: host_extractor.go
        path: "go.opentelemetry.io/otelc-contrib/instrumentation/github.com/linode/linodego/v2/otelclinodego"

