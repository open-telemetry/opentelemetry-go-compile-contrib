# Codecov configuration.
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      # pkg/ module tree
      pkg:
        flags:
          - pkg
        target: 70%
        # informational: false (enforcing). A drop below target blocks the PR.
        informational: false
      # instrumentation/ module tree
      instrumentation:
        flags:
          - instrumentation
        # informational: true until baseline unit coverage targets are set.
        informational: true
