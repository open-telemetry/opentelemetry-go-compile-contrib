name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - "release/v*.*.x"  # for hotfix releases

permissions:
  contents: read

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') && !endsWith(github.event.pull_request.head.ref,
      '.x')
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        # The client-id var gates App mode. When it is unset, the step is
        # skipped by design and the workflow falls back to github.token.
        if: vars.OTELBOT_GO_COMPILE_CONTRIB_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.OTELBOT_GO_COMPILE_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_GO_COMPILE_CONTRIB_PRIVATE_KEY }}
          # This workflow only pushes tags and creates releases, so it needs
          # contents: write only. The release-prepare.yml copy also requests
          # pull-requests: write. Keep the copies intentionally different and
          # update both together on a SHA bump.
          permission-contents: write

      - name: Warn on App token failure
        if: steps.app-token.outcome == 'failure'
        run: echo "::warning::GitHub App token generation failed, falling back to github.token. Check the OTELBOT secrets."

      - name: Checkout merge commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          # Do not persist the checkout credential in the runner git config.
          # Remote tag checks and pushes authenticate with an explicit token URL.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Plan tags from versions.yaml
        id: plan
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          push_token="${APP_TOKEN:-${GITHUB_TOKEN}}"
          server_host="${GITHUB_SERVER_URL#https://}"
          remote_url="https://x-access-token:${push_token}@${server_host}/${GITHUB_REPOSITORY}.git"
          # Authenticate ls-remote explicitly because persist-credentials is false.
          git ls-remote --tags "${remote_url}" > "${RUNNER_TEMP}/remote-tags.txt"

          make verify-versions
          # TODO: Making GPG signing optional in `multimod tag` (which currently
          # hardcodes `git tag -a -s`) should be made upstream; for now we have
          # releasetags to do this.
          go -C .github/tools run ./releasetags \
            -versions-file "${GITHUB_WORKSPACE}/versions.yaml" \
            -repo-root "${GITHUB_WORKSPACE}" \
            -remote-tags-file "${RUNNER_TEMP}/remote-tags.txt" \
            -head-commit "$(git rev-parse HEAD)" \
            -allow-all-at-head \
            -github-output "${GITHUB_OUTPUT}" \
            -print-tags > "${RUNNER_TEMP}/release-tags.txt"
          rm -rf .bin

      - name: Create and push tags
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          push_token="${APP_TOKEN:-${GITHUB_TOKEN}}"
          server_host="${GITHUB_SERVER_URL#https://}"
          remote_url="https://x-access-token:${push_token}@${server_host}/${GITHUB_REPOSITORY}.git"

          # The bot identity must match the credential that pushes the tags.
          if [ -n "${APP_TOKEN}" ]; then
            git config user.name "otelbot-go-compile-contrib[bot]"
            git config user.email "otelbot-go-compile-contrib[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          head_commit=$(git rev-parse HEAD)
          remote_tags_file="${RUNNER_TEMP}/remote-tags.txt"

          tags_to_push=()
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            remote_commit=$(awk -v ref="refs/tags/${tag}^{}" '$2 == ref {print $1; exit}' "${remote_tags_file}")
            if [ -z "${remote_commit}" ]; then
              remote_commit=$(awk -v ref="refs/tags/${tag}" '$2 == ref {print $1; exit}' "${remote_tags_file}")
            fi

            if [ -n "${remote_commit}" ]; then
              if [ "${remote_commit}" = "${head_commit}" ]; then
                echo "Tag '${tag}' already exists on remote pointing to current commit (${head_commit}). Skipping."
              else
                echo "::error::Tag '${tag}' already exists on remote pointing to ${remote_commit}, expected ${head_commit}."
                exit 1
              fi
            else
              git tag -a "${tag}" -m "Release ${tag}"
              tags_to_push+=("${tag}")
            fi
          done < "${RUNNER_TEMP}/release-tags.txt"

          if [ "${#tags_to_push[@]}" -gt 0 ]; then
            echo "Pushing ${#tags_to_push[@]} tag(s)..."
            git push "${remote_url}" "${tags_to_push[@]}"
          else
            echo "All tags already exist on remote."
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.plan.outputs.release_title }}
          IS_PRERELEASE: ${{ steps.plan.outputs.is_prerelease }}
        run: |
          RELEASE_FLAGS=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --draft \
            --title "${RELEASE_TITLE}" \
            --notes-file .github/release-notes.md \
            "${RELEASE_FLAGS[@]}"
