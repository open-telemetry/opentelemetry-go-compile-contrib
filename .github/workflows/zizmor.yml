name: Zizmor GitHub Actions Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 10 * * 4' # weekly at 10:47 (UTC) on Thursday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor Security Analysis
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@c717adbcb56efc45c5dea293accfc6c3462bcdd1 # v0.19.0
