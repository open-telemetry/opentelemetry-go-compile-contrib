name: Check License Headers
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # for actions/checkout
jobs:
  # This is a required workflow, so it must always run and report a status.
  # We use dorny/paths-filter at the job level instead of workflow-level path filters
  # to ensure the workflow runs and the "done" job reports success even when no relevant files change.
  # This prevents PRs from being blocked by missing status checks.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # for dorny/paths-filter to inspect pull request changes
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - "**/*.go"
              - "**/*.sh"
              - "Makefile"
              - ".github/workflows/check-license-headers.yaml"
  check-license-headers:
    name: Check License Headers
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint/license-header
  done:
    name: Done (Check License Headers)
    runs-on: ubuntu-latest
    needs: [changes, check-license-headers]
    if: always()
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          LICENSE_RESULT: ${{ needs.check-license-headers.result }}
        run: |
          echo "Changes result: $CHANGES_RESULT"
          echo "Code changed: $CODE_CHANGED"
          echo "License result: $LICENSE_RESULT"
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "❌ Change detection failed"
            exit 1
          fi
          if [[ "$CODE_CHANGED" == "false" ]]; then
            echo "✅ No relevant code changes; license check skipped"
            exit 0
          fi
          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "❌ Unexpected change detection output: $CODE_CHANGED"
            exit 1
          fi
          if [[ "$LICENSE_RESULT" == "success" ]]; then
            echo "✅ License check passed"
            exit 0
          fi
          echo "❌ License check failed"
          exit 1
